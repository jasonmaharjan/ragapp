services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - REDIS_URL=redis://redis:6379
      - CACHE_TTL_SECONDS=${CACHE_TTL_SECONDS:-1800}
      - DB_URL=postgresql://ragapp:ragapp@postgres:5432/ragapp
    depends_on:
      - redis
      - postgres

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ragapp
      POSTGRES_PASSWORD: ragapp
      POSTGRES_DB: ragapp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
